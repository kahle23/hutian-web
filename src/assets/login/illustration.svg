<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420">
  <!-- 壶天登录页插画：品牌色抽象场景（渐变主视觉 + 轨道 + 卫星 + 底部云纹，纯几何无字体依赖） -->
  <defs>
    <linearGradient id="hutian-i-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#406eeb" />
      <stop offset="1" stop-color="#6a5af9" />
    </linearGradient>
    <radialGradient id="hutian-i-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#406eeb" stop-opacity="0.18" />
      <stop offset="1" stop-color="#406eeb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景柔光 -->
  <circle cx="150" cy="105" r="95" fill="url(#hutian-i-halo)" />
  <circle cx="425" cy="305" r="120" fill="url(#hutian-i-halo)" />

  <!-- 轨道 -->
  <circle
    cx="280"
    cy="205"
    r="152"
    fill="none"
    stroke="#406eeb"
    stroke-opacity="0.28"
    stroke-width="2"
    stroke-dasharray="5 10"
  />

  <!-- 中心主视觉：渐变圆角方 + 壶形 -->
  <ellipse cx="280" cy="306" rx="96" ry="14" fill="#406eeb" opacity="0.12" />
  <rect x="196" y="122" width="168" height="168" rx="38" fill="url(#hutian-i-main)" />
  <g transform="translate(248 164) scale(2.1)">
    <circle cx="15.2" cy="4.6" r="1.3" fill="#fff" />
    <rect x="4.4" y="6.1" width="21.6" height="4.4" rx="2.2" fill="#fff" />
    <rect x="11" y="10" width="8.4" height="7.2" fill="#fff" />
    <circle cx="15.2" cy="24.2" r="10.2" fill="#fff" />
    <rect x="11.2" y="32.6" width="8" height="3.8" rx="1.6" fill="#fff" />
    <circle cx="11.2" cy="21.4" r="2.6" fill="#fff" opacity="0.35" />
  </g>

  <!-- 卫星点缀 -->
  <circle cx="118" cy="298" r="14" fill="#6a5af9" opacity="0.85" />
  <circle cx="448" cy="128" r="10" fill="#409eff" opacity="0.8" />
  <circle cx="474" cy="322" r="6" fill="#406eeb" opacity="0.55" />
  <circle cx="132" cy="120" r="5" fill="#6a5af9" opacity="0.5" />
  <circle cx="402" cy="82" r="16" fill="none" stroke="#6a5af9" stroke-opacity="0.4" stroke-width="2.5" />
  <circle cx="106" cy="196" r="9" fill="none" stroke="#409eff" stroke-opacity="0.45" stroke-width="2" />

  <!-- 底部云纹 -->
  <path
    d="M0 366 C 70 348 140 348 210 366 C 280 384 350 384 420 366 C 490 348 535 350 560 362 L 560 420 L 0 420 Z"
    fill="#406eeb"
    opacity="0.1"
  />
  <path
    d="M0 388 C 80 372 160 372 240 388 C 320 404 400 404 480 388 C 520 380 545 380 560 386 L 560 420 L 0 420 Z"
    fill="#406eeb"
    opacity="0.16"
  />
</svg>

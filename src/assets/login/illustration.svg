  <!-- 卫星点缀 -->
  <circle cx="118" cy="298" r="14" fill="#14b8a6" opacity="0.85" />
  <circle cx="448" cy="128" r="10" fill="#fbbf24" opacity="0.8" />
  <circle cx="474" cy="322" r="6" fill="#0d9488" opacity="0.55" />
  <circle cx="132" cy="120" r="5" fill="#f59e0b" opacity="0.5" />
  <circle cx="402" cy="82" r="16" fill="none" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2.5" />
  <circle cx="106" cy="196" r="9" fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="2" />


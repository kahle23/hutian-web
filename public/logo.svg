<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 壶天品牌标识：青瓷底 + 金葫芦（有机收腰轮廓、径向体渐变、绿叶卷须、腰间红绳），腹中星斗月牙。「壶卢（葫芦）」为壶之古称，悬壶藏天地，即「壶里乾坤大」 -->
  <defs>
    <linearGradient id="ht-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset=".55" stop-color="#0d9488" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <radialGradient id="ht-gold" cx=".36" cy=".3" r="1">
      <stop offset="0" stop-color="#fde68a" />
      <stop offset=".4" stop-color="#fbbf24" />
      <stop offset=".75" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#b45309" />
    </radialGradient>
    <mask id="ht-moon">
      <rect x="22" y="31" width="13" height="13" fill="#fff" />
      <circle cx="29.2" cy="35.3" r="2.15" fill="#000" />
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ht-bg)" />
  <circle cx="32" cy="32.5" r="23.5" fill="#5eead4" opacity=".16" />
  <!-- 葫芦主体 -->
  <path d="M32 10.5 C38.5 10.5 41 15 40.6 19.5 C40.2 23 38.2 25.2 36.4 27.8 C35.7 28.9 35.5 29.5 35.6 30.3 C35.8 31.8 37.3 32.3 38.9 33.7 C43.2 35.9 45.3 39.6 45.3 43.6 C45.3 50.2 39.3 55.2 32 55.2 C24.7 55.2 18.7 50.2 18.7 43.6 C18.7 39.6 20.8 35.9 25.1 33.7 C26.7 32.3 28.2 31.8 28.4 30.3 C28.5 29.5 28.3 28.9 27.6 27.8 C25.8 25.2 23.8 23 23.4 19.5 C23 15 25.5 10.5 32 10.5 Z" fill="url(#ht-gold)" stroke="#9a4a08" stroke-opacity=".5" stroke-width=".9" />
  <!-- 腰间收束阴影 -->
  <path d="M28 28.3 C29.6 31.1 34.4 31.1 36 28.3" stroke="#9a4a08" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <!-- 蒂与叶、卷须 -->
  <path d="M32.1 11.2 C32 9 32.7 7.6 34.3 6.9" stroke="#a16207" stroke-width="2.7" stroke-linecap="round" fill="none" />
  <path d="M33.6 8.4 C35.2 5.4 39 4.6 41.2 6 C40.8 9.2 37.4 10.8 34.6 9.6 C34.2 9.2 33.8 8.8 33.6 8.4 Z" fill="#65a30d" />
  <path d="M34.3 8.6 C36.2 7.6 38.4 7 40.2 6.7" stroke="#3f6212" stroke-width=".8" fill="none" opacity=".9" />
  <path d="M31.6 7.6 C28.8 5.2 24.9 5.4 24.3 7.9 C23.9 9.8 25.7 10.8 26.7 9.7 C27.5 8.8 26.6 7.6 25.4 8.1" stroke="#65a30d" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <!-- 高光 -->
  <ellipse cx="28.4" cy="16.8" rx="2.1" ry="3.4" fill="#fff" opacity=".38" transform="rotate(-22 28.4 16.8)" />
  <circle cx="31.9" cy="14.3" r=".9" fill="#fff" opacity=".35" />
  <ellipse cx="25.6" cy="38.2" rx="1.9" ry="4.4" fill="#fff" opacity=".22" transform="rotate(-16 25.6 38.2)" />
  <circle cx="27.3" cy="33.6" r=".75" fill="#fff" opacity=".3" />
  <!-- 腰间红绳 -->
  <path d="M35.2 29.7 L33 28.3 Q32.4 30.4 33.8 31.3 Z" fill="#dc2626" />
  <path d="M35.6 29.6 L37.6 28 Q38.4 30 36.9 31 Z" fill="#b91c1c" />
  <circle cx="35.3" cy="29.9" r="1.35" fill="#dc2626" />
  <circle cx="34.9" cy="29.4" r=".4" fill="#fca5a5" opacity=".8" />
  <path d="M36 31 C39 33.6 37.8 37 40.6 40.6" stroke="#dc2626" stroke-width="1.7" stroke-linecap="round" fill="none" />
  <path d="M34.9 31.2 C36.2 34.4 34.8 36.4 36.6 39.2" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- 腹中星斗月牙 -->
  <circle cx="27.5" cy="36.5" r="2.6" fill="#fff" mask="url(#ht-moon)" />
  <path d="M32.6 38.7 L33.2 40 L34.5 40.6 L33.2 41.2 L32.6 42.5 L32 41.2 L30.7 40.6 L32 40 Z" fill="#fff" />
  <circle cx="30.2" cy="33.2" r=".95" fill="#fff" opacity=".95" />
  <circle cx="25.3" cy="42" r=".8" fill="#fff" opacity=".8" />
  <circle cx="34.2" cy="45.3" r=".9" fill="#fff" opacity=".85" />
  <circle cx="30.8" cy="48.3" r=".6" fill="#fff" opacity=".7" />
  <circle cx="35.8" cy="43.2" r=".5" fill="#fff" opacity=".6" />
</svg>
